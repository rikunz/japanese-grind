<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz — Nihonggo Club</title>
<link rel="icon" href="assets/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/quiz.css">
</head>
<body>
<div class="accent-bar"></div>

<header class="site-header">
  <div class="container site-header__inner">
    <a class="brand" href="./">
      <img src="assets/logo.svg" alt="">
      <span>
        <span class="brand__name">NIHONGGO CLUB</span><br>
        <span class="brand__jp">にほんごクラブ</span>
      </span>
    </a>
    <nav class="site-nav">
      <a class="btn btn--ghost btn--sm" href="./">Beranda</a>
      <a class="btn btn--outline btn--sm" id="printLink" href="print">Cetak soal</a>
    </nav>
  </div>
</header>

<main class="site-main">
  <div class="container container-narrow">
    <div id="app">
      <p class="skeleton-note">Memuat soal…</p>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="container site-footer__inner">
    <span>Nihonggo Club</span>
    <span>Jawaban dinilai langsung di browser.</span>
  </div>
</footer>

<!-- Lapisan jeda ujian -->
<div class="exam-overlay" id="examOverlay" hidden>
  <div class="exam-overlay__card">
    <div class="exam-overlay__icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/>
      </svg>
    </div>
    <h2 id="examTitle">Ujian dijeda</h2>
    <p id="examDesc">Kembali ke layar penuh untuk melanjutkan.</p>
    <ul class="exam-log" id="examLog"></ul>
    <div class="btn-row" style="justify-content:center">
      <button type="button" class="btn btn--primary btn--lg" id="examResume">Kembali ke layar penuh</button>
      <button type="button" class="btn btn--ghost" id="examQuit">Keluar dari ujian</button>
    </div>
  </div>
</div>

<div class="exam-print-block">Lembar ujian tidak dapat dicetak selama mode ujian berjalan.</div>

<script src="js/common.js"></script>
<script src="js/proctor.js"></script>
<script src="js/quiz.js"></script>
</body>
</html>
